    <text x="64" y="196" font-size="26" font-weight="600" letter-spacing="-0.4" fill="#C9CED6">I build the <tspan fill="url(#accent)">digital systems</tspan></text>
    <text x="64" y="230" font-size="26" font-weight="600" letter-spacing="-0.4" fill="#C9CED6">behind growing businesses.</text>
