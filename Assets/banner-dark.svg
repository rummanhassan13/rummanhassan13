    <text x="216" y="22" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#6B7380">~/rummanhassan13</text>

    <g font-family="'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace" font-size="14.5">
      <text x="20" y="66"><tspan fill="#A8FF2A">$</tspan><tspan fill="#F7F8FA"> whoami</tspan></text>
