<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Rumman Hassan</title>
  <desc id="d">I build the digital systems behind growing businesses: web apps, ecommerce stores and AI systems.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F7F8FA" opacity="0.06"/>
    </pattern>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 40) scale(520 300)">
      <stop offset="0" stop-color="#A8FF2A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#A8FF2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 300) scale(480 260)">
      <stop offset="0" stop-color="#5EF2C2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5EF2C2" stop-opacity="0"/>
